# Analisi statica severa: per il Dart CodeQL non esiste, quindi gli errori si fermano qui.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # avvisi trattati come errori nella pipeline
    missing_required_param: error
    missing_return: error
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - android/**
    - windows/**
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_super_parameters
