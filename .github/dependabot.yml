# Aggiornamenti automatici delle dipendenze (pull request settimanali).
# Le azioni sono richiamate per SHA: Dependabot aggiorna anche quelli.
# Quando arriverà il progetto Flutter si aggiungerà l'ecosistema "pub".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      azioni:
        patterns: ["*"]
