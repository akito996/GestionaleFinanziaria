# Aggiornamenti automatici delle dipendenze (pull request settimanali).
# Le azioni sono richiamate per SHA: Dependabot aggiorna anche quelli.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      librerie:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      azioni:
        patterns: ["*"]
