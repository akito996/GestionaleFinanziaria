# Verifica del codice a ogni push e pull request: formattazione, analisi statica severa e test.
# La versione di Flutter è quella scritta in pubspec.yaml (environment.flutter).
# Con un tag "v*" (es. v0.9.0), se tutto è verde, pubblica anche la release
# su GitHub (ADR-018).
name: Verifica

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter dal repository ufficiale, senza azioni di terzi: subosito/flutter-action usa
      # actions/cache per etichetta e la regola "azioni fissate per SHA" del repository lo blocca.
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          echo "Flutter $version"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Codice generato aggiornato (drift)
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analisi statica
        run: flutter analyze --fatal-infos
      - name: Test
        run: |
          set -o pipefail
          flutter test -r expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Motivo dell'errore (test)
        if: failure()
        run: |
          motivo="$(grep -v -E '^\s*$' "$RUNNER_TEMP/test.log" | grep -E -B2 -A20 'EXCEPTION CAUGHT|Expected:|\[E\]' | head -80)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Test::${motivo}"

  # App Windows da scaricare e provare (Actions -> esecuzione -> Artifacts).
  # Non firmata: Windows SmartScreen mostra un avviso al primo avvio.
  windows:
    name: Build Windows (prova)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Lettura dei contratti PDF con PDFium (Windows)
        run: flutter test test/core/estrazione_pdf_test.dart
      - name: Test sull'app vera (primo avvio, blocco, sblocco, recupero)
        run: |
          set -o pipefail
          flutter test integration_test -d windows -r expanded 2>&1 | tee "$RUNNER_TEMP/integration.log"
      # Il canale nativo di Windows Hello risponde (sul PC di GitHub di solito
      # non è configurato: "nessunMetodo").
      - name: Sblocco rapido (risultato)
        if: success()
        run: |
          esito="$(grep -E -m1 'SBLOCCO:' "$RUNNER_TEMP/integration.log" || true)"
          echo "::notice title=Sblocco rapido (Windows)::${esito:-nessun risultato}"
      # In caso di errore il motivo diventa un'annotazione (visibile nel riepilogo dell'esecuzione).
      - name: Motivo dell'errore
        if: failure()
        run: |
          # Prima gli errori di compilazione C++ (MSBuild, in minuscolo), poi
          # quelli dei test.
          motivo="$( (grep -E -m15 'error [A-Z]+[0-9]+|fatal error|: error' "$RUNNER_TEMP/integration.log"; grep -E 'SCHERMO:|FINESTRA:|PULSANTE:|SBLOCCO:|Warning: A call to tap' "$RUNNER_TEMP/integration.log"; grep -v -E '^\s*$' "$RUNNER_TEMP/integration.log" | grep -E -A25 'EXCEPTION CAUGHT|Expected:|\[E\]|Error') | head -70)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Test sull'app vera::${motivo}"
      - name: Build
        # Il commit compare nella firma della versione (in basso a sinistra).
        # --split-debug-info: i simboli di debug vanno in un file a parte
        # (artifact "simboli"), l'app installata è più leggera.
        # Segreto del client Google "App desktop" (sincronizzazione con Drive):
        # solo dai secret di GitHub, mai nel repository. Senza, la build
        # funziona ma la sincronizzazione su Windows non è disponibile.
        env:
          GOOGLE_CLIENT_SECRET_WINDOWS: ${{ secrets.GOOGLE_CLIENT_SECRET_WINDOWS }}
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET_WINDOWS" ]; then
            echo "::warning title=Google Drive::Secret GOOGLE_CLIENT_SECRET_WINDOWS non configurato: nella build Windows la sincronizzazione non è disponibile."
          fi
          flutter build windows --release --build-number=${{ github.run_number }} --split-debug-info=build/simboli/windows --dart-define=GF_COMMIT=${{ github.sha }} --dart-define=GOOGLE_CLIENT_SECRET_WINDOWS="$GOOGLE_CLIENT_SECRET_WINDOWS"
      # Librerie Visual C++ accanto all'app: parte anche sui PC appena
      # installati, senza il pacchetto "Visual C++ Redistributable".
      # Distribuzione locale consentita dalla licenza (file elencati in redist).
      - name: Librerie Visual C++
        run: |
          vs="$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")"
          crt="$(ls -d "$vs"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -1)"
          echo "Da: $crt"
          cp "$crt"/msvcp140.dll "$crt"/msvcp140_1.dll "$crt"/msvcp140_2.dll \
            "$crt"/vcruntime140.dll "$crt"/vcruntime140_1.dll \
            build/windows/x64/runner/Release/
      - name: Peso della build
        run: python tool/dimensioni.py build/windows/x64/runner/Release
      # Ogni build deve contenere il suo commit (lo stesso della firma in basso
      # a sinistra nell'app). VERSIONE.txt lo mostra anche aprendo lo zip:
      # gli orari dei file nello zip non bastano (molti file di Flutter
      # tengono sempre la stessa data).
      - name: Commit nella build e VERSIONE.txt
        run: |
          breve="${GITHUB_SHA::7}"
          if ! grep -aq "$breve" build/windows/x64/runner/Release/data/app.so; then
            echo "::error title=Build Windows::La build non contiene il commit $breve"
            exit 1
          fi
          printf 'WalleCy per Windows\r\nCommit: %s\r\nBuild n. %s del %s\r\n' \
            "$breve" "${{ github.run_number }}" "$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')" \
            > build/windows/x64/runner/Release/VERSIONE.txt
          echo "::notice title=Build Windows::Commit $breve verificato nella build"
      # Firma del programma (Authenticode): senza, Windows mostra "PC
      # protetto da Windows" (SmartScreen) a chi lo scarica.
      - name: Firma del programma Windows
        shell: pwsh
        run: |
          $file = Get-ChildItem build/windows/x64/runner/Release -Recurse -Include *.exe, *.dll
          $righe = foreach ($f in $file) {
            $firma = Get-AuthenticodeSignature $f.FullName
            $chi = if ($firma.SignerCertificate) { ($firma.SignerCertificate.Subject -split ',')[0] } else { 'nessuno' }
            "$($f.Name): $($firma.Status) ($chi)"
          }
          echo "::notice title=Firma Windows::$($righe -join ' · ')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WalleCy-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
      # VERSIONE.txt serve solo nello zip, non nel pacchetto dello Store.
      - name: Via VERSIONE.txt prima del pacchetto MSIX
        run: rm -f build/windows/x64/runner/Release/VERSIONE.txt
      # Pacchetto per il Microsoft Store (ADR-017): lo firma Microsoft quando
      # lo pubblica, quindi niente avviso "PC protetto da Windows". I dati
      # dello Store (Partner Center) sono pubblici: variabili del repository,
      # non secret. Versione: maggiore.minore del pubspec + numero
      # dell'esecuzione (lo Store vuole numeri sempre crescenti, l'ultimo 0).
      - name: Pacchetto MSIX (Microsoft Store)
        shell: pwsh
        env:
          MSIX_NOME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_EDITORE: ${{ vars.MSIX_PUBLISHER }}
          MSIX_NOME_EDITORE: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.').Matches[0].Groups
          $argomenti = @{
            Build = 'build/windows/x64/runner/Release'
            Uscita = 'build/WalleCy.msix'
            Versione = "$($v[1].Value).$($v[2].Value).${{ github.run_number }}.0"
          }
          if ($env:MSIX_NOME -and $env:MSIX_EDITORE -and $env:MSIX_NOME_EDITORE) {
            $argomenti.Nome = $env:MSIX_NOME
            $argomenti.Editore = $env:MSIX_EDITORE
            $argomenti.NomeEditore = $env:MSIX_NOME_EDITORE
          } else {
            echo "::warning title=Microsoft Store::Dati dello Store non ancora impostati (variabili MSIX_*): pacchetto di prova, non caricabile nello Store."
          }
          ./tool/msix.ps1 @argomenti
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WalleCy-msix-${{ github.sha }}
          path: build/WalleCy.msix
          if-no-files-found: error
          retention-days: 14
      # Per leggere gli errori ("flutter symbolize"): restano più a lungo.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simboli-windows-${{ github.sha }}
          path: build/simboli/windows/
          if-no-files-found: error
          retention-days: 90

  # App Android da installare su telefono e tablet (Actions -> esecuzione ->
  # Artifacts): variante "ufficiale" (dati veri) e "prova" (installabile accanto).
  # Vedi docs/adr/0010.
  android:
    name: Android (APK ufficiale e prova)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter, licenze e NDK Android
        run: |
          flutter --disable-analytics
          flutter --version
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          # NDK della versione chiesta da Flutter, con 3 tentativi: un download
          # interrotto (archivio corrotto) non deve far fallire la build.
          ndk="$(sed -n 's/.*val ndkVersion: String = "\(.*\)".*/\1/p' \
            "$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$ndk" ]; then
            echo "::warning title=Android::Versione NDK non trovata: la scarica Gradle durante la build."
            exit 0
          fi
          echo "NDK $ndk"
          for tentativo in 1 2 3; do
            "$sdk" --install "ndk;$ndk" > /dev/null && break
            echo "::warning title=Android::Download dell'NDK non riuscito (tentativo $tentativo di 3)."
            [ "$tentativo" = 3 ] && exit 1
            sleep 20
          done
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      # Chiave definitiva dai secret di GitHub (mai nel repository). Senza secret
      # (es. pull request da fork) si usa la chiave di debug: APK solo per prova.
      - name: Chiave di firma definitiva
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Android::Chiave di firma non configurata: APK firmati con la chiave di debug (solo per prova, i dati non sopravvivono al cambio di chiave)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          # Dati pubblici del certificato (nessun segreto): scadenza e chiave.
          dati="$(keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null || true)"
          validita="$(echo "$dati" | grep -m1 -E '^Valid from' | sed 's/^Valid from: //' || true)"
          chiave="$(echo "$dati" | grep -m1 -E 'Subject Public Key Algorithm' | sed 's/.*Algorithm: //' || true)"
          firma="$(echo "$dati" | grep -m1 -E '^Signature algorithm name' | sed 's/.*name: //' || true)"
          echo "::notice title=Certificato di firma Android::Validità: $validita · Chiave: $chiave · Algoritmo: $firma"
      # Un APK per tipo di processore: arm64-v8a (quasi tutti i telefoni e
      # tablet) e armeabi-v7a (dispositivi vecchi a 32 bit). Simboli di debug
      # in un file a parte (artifact "simboli").
      - name: Build APK (ufficiale e prova, per tipo di processore)
        run: |
          set -o pipefail
          for variante in ufficiale prova; do
            flutter build apk --release --flavor "$variante" \
              --build-number=${{ github.run_number }} \
              --split-per-abi --target-platform android-arm,android-arm64 \
              --split-debug-info=build/simboli/android \
              --dart-define=GF_COMMIT=${{ github.sha }} \
              2>&1 | tee -a "$RUNNER_TEMP/build-android.log"
          done
      - name: Peso delle build
        run: python3 tool/dimensioni.py build/app/outputs/flutter-apk/*-release.apk
      # Ogni APK deve contenere il suo commit (lo stesso della firma in basso
      # a sinistra nell'app): mai una build vecchia con un nome nuovo.
      - name: Commit negli APK
        run: |
          breve="${GITHUB_SHA::7}"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            trovati="$(unzip -p "$apk" 'lib/*/libapp.so' | grep -ac "$breve" || true)"
            if [ "${trovati:-0}" -eq 0 ]; then
              echo "::error title=APK $(basename "$apk")::L'APK non contiene il commit $breve"
              exit 1
            fi
          done
          echo "::notice title=APK::Commit $breve verificato in tutti gli APK"
      # Prima di ogni rilascio: ogni APK firmato con la chiave definitiva e
      # con gli schemi moderni (v2/v3), impronta SHA-1 per i client OAuth
      # Android (pubblica), e librerie a 64 bit allineate a 16 KB (telefoni
      # Android 15+ con pagine da 16 KB: senza, l'app non si avvia).
      - name: Verifica firme e allineamento APK
        run: |
          strumenti="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ndk="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          readelf="$(ls "$ndk"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            nome="$(basename "$apk" -release.apk)"
            verifica="$("$strumenti/apksigner" verify --verbose --print-certs "$apk")"
            schemi="$(echo "$verifica" | grep -E '^Verified using v[0-9.]+ scheme' \
              | sed -E 's/^Verified using (v[0-9.]+) scheme.*: (true|false)$/\1 \2/' \
              | awk '$2=="true"{print $1}' | paste -sd ',' -)"
            titolare="$(echo "$verifica" | grep -m1 'certificate DN' | sed 's/.*DN: //')"
            chiave="$(echo "$verifica" | grep -m1 'key algorithm' | awk '{print $NF}') $(echo "$verifica" | grep -m1 'key size' | awk '{print $NF}') bit"
            sha1="$(echo "$verifica" | grep -m1 'SHA-1 digest' | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
            pagine="non serve (32 bit)"
            if [[ "$nome" == *arm64* ]]; then
              pagine="sì"
              "$strumenti/zipalign" -c -P 16 4 "$apk" > /dev/null 2>&1 || pagine="no (zip)"
              rm -rf so && mkdir so && unzip -q "$apk" 'lib/arm64-v8a/*.so' -d so
              for so in so/lib/arm64-v8a/*.so; do
                if "$readelf" -lW "$so" | awk '$1=="LOAD"{print $NF}' | grep -qvE '^0x(4000|8000|10000)$'; then
                  pagine="no ($(basename "$so"))"
                fi
              done
            fi
            echo "::notice title=Firma $nome::Schemi: $schemi · $chiave · $titolare · SHA-1 $sha1 · 16 KB: $pagine"
            if [[ "$pagine" == "no ("* ]]; then
              echo "::warning title=16 KB $nome::Non allineato a 16 KB: $pagine"
            fi
            if [[ "$schemi" != *v2* ]]; then
              echo "::error title=Firma $nome::APK senza firma v2: non si installa sui telefoni moderni."
              exit 1
            fi
          done
      # Il file da installare per provare (telefoni e tablet a 64 bit), con un
      # nome chiaro. Lo zip con tutti gli APK resta per i casi particolari.
      - name: APK da installare
        run: |
          mkdir -p build/da-installare
          # Il commit nel nome: si vede subito quale versione si installa.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prova-release.apk "build/da-installare/WalleCy-prova-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-da-installare-${{ github.sha }}
          path: build/da-installare/WalleCy-prova-*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WalleCy-android-tutti-gli-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simboli-android-${{ github.sha }}
          path: build/simboli/android/
          if-no-files-found: error
          retention-days: 90
      - name: Motivo dell'errore (build)
        if: failure()
        run: |
          motivo="$(grep -v -E '^\s*$' "$RUNNER_TEMP/build-android.log" 2>/dev/null | grep -E -A25 'FAILURE|What went wrong|Error' | head -60)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Android (build)::${motivo}"
      - name: Via la chiave di firma dal runner
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

  # Test sull'app vera in emulatori Android: un telefono e un tablet.
  android-emulatore:
    name: Android (${{ matrix.dispositivo }} nell'emulatore)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dispositivo: telefono
            profilo: pixel_6
          - dispositivo: tablet
            profilo: pixel_tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter, licenze e NDK Android
        run: |
          flutter --disable-analytics
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          # NDK della versione chiesta da Flutter, con 3 tentativi: un download
          # interrotto (archivio corrotto) non deve far fallire la build.
          ndk="$(sed -n 's/.*val ndkVersion: String = "\(.*\)".*/\1/p' \
            "$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$ndk" ]; then
            echo "::warning title=Android::Versione NDK non trovata: la scarica Gradle durante la build."
            exit 0
          fi
          echo "NDK $ndk"
          for tentativo in 1 2 3; do
            "$sdk" --install "ndk;$ndk" > /dev/null && break
            echo "::warning title=Android::Download dell'NDK non riuscito (tentativo $tentativo di 3)."
            [ "$tentativo" = 3 ] && exit 1
            sleep 20
          done
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Accelerazione KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test sull'app vera nell'emulatore (${{ matrix.dispositivo }})
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profilo }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'set -o pipefail; flutter test integration_test --flavor prova -d emulator-5554 -r expanded 2>&1 | tee "$RUNNER_TEMP/integration-android.log"'
      # Cosa ha letto Tesseract dallo scontrino di prova (riepilogo della CI).
      - name: Lettura delle foto (risultato)
        if: success()
        run: |
          esito="$(grep -E -m1 'SCONTRINO:' "$RUNNER_TEMP/integration-android.log" || true)"
          echo "::notice title=Lettura foto (${{ matrix.dispositivo }})::${esito:-nessun risultato}"
          esito="$(grep -E -m1 'SBLOCCO:' "$RUNNER_TEMP/integration-android.log" || true)"
          echo "::notice title=Sblocco rapido (${{ matrix.dispositivo }})::${esito:-nessun risultato}"
      - name: Motivo dell'errore
        if: failure()
        run: |
          log="$(cat "$RUNNER_TEMP/integration-android.log" 2>/dev/null)"
          motivo="$( (echo "$log" | grep -E 'SCHERMO:|FINESTRA:|PULSANTE:|APPUNTI|FOTO:|SCONTRINO:|SBLOCCO:|Warning: A call to tap'; echo "$log" | grep -v -E '^\s*$' | grep -E -A25 'EXCEPTION CAUGHT|Expected:|\[E\]|Error|FAILURE|What went wrong') | head -70)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Android (${{ matrix.dispositivo }})::${motivo}"

  # Release su GitHub (solo con un tag "v*" e tutti i controlli verdi):
  # APK ufficiali firmati, zip per Windows, impronte SHA-256 e attestazione
  # di provenienza (Sigstore): chiunque può verificare che i file sono stati
  # costruiti da GitHub Actions da questo codice.
  rilascio:
    name: Release su GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, android-emulatore]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WalleCy-windows-${{ github.sha }}
          path: scaricati/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WalleCy-android-tutti-gli-apk-${{ github.sha }}
          path: scaricati/android
      - name: File della release
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v+" pubspec.yaml || {
            echo "::error title=Versione::Il tag $GITHUB_REF_NAME non coincide con la versione di pubspec.yaml."
            exit 1
          }
          mkdir rilascio
          cp scaricati/android/app-arm64-v8a-ufficiale-release.apk "rilascio/WalleCy-$v-android-arm64.apk"
          cp scaricati/android/app-armeabi-v7a-ufficiale-release.apk "rilascio/WalleCy-$v-android-armv7.apk"
          (cd scaricati/windows && zip -qr "../../rilascio/WalleCy-$v-windows-x64.zip" .)
          (cd rilascio && sha256sum WalleCy-* > SHA256SUMS.txt)
          cat rilascio/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'rilascio/WalleCy-*'
      # Le versioni 0.x escono come "pre-release" (anteprima).
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="docs/rilasci/$GITHUB_REF_NAME.md"
          [ -f "$note" ] || { echo "::error title=Note di rilascio::Manca $note"; exit 1; }
          anteprima=()
          [[ "$GITHUB_REF_NAME" == v0.* ]] && anteprima=(--prerelease)
          gh release create "$GITHUB_REF_NAME" rilascio/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WalleCy ${GITHUB_REF_NAME#v}" --notes-file "$note" "${anteprima[@]}"
          echo "::notice title=Release::https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
