# Verifica del codice a ogni push e pull request: formattazione, analisi statica severa e test.
# La versione di Flutter è quella scritta in pubspec.yaml (environment.flutter).
name: Verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter dal repository ufficiale, senza azioni di terzi: subosito/flutter-action usa
      # actions/cache per etichetta e la regola "azioni fissate per SHA" del repository lo blocca.
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          echo "Flutter $version"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Codice generato aggiornato (drift)
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analisi statica
        run: flutter analyze --fatal-infos
      - name: Test
        run: |
          set -o pipefail
          flutter test -r expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Motivo dell'errore (test)
        if: failure()
        run: |
          motivo="$(grep -v -E '^\s*$' "$RUNNER_TEMP/test.log" | grep -E -B2 -A20 'EXCEPTION CAUGHT|Expected:|\[E\]' | head -80)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Test::${motivo}"

  # App Windows da scaricare e provare (Actions -> esecuzione -> Artifacts).
  # Non firmata: Windows SmartScreen mostra un avviso al primo avvio.
  windows:
    name: Build Windows (prova)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Lettura dei contratti PDF con PDFium (Windows)
        run: flutter test test/core/estrazione_pdf_test.dart
      - name: Test sull'app vera (primo avvio, blocco, sblocco, recupero)
        run: |
          set -o pipefail
          flutter test integration_test -d windows -r expanded 2>&1 | tee "$RUNNER_TEMP/integration.log"
      # In caso di errore il motivo diventa un'annotazione (visibile nel riepilogo dell'esecuzione).
      - name: Motivo dell'errore
        if: failure()
        run: |
          motivo="$( (grep -E 'SCHERMO:|FINESTRA:|PULSANTE:|Warning: A call to tap' "$RUNNER_TEMP/integration.log"; grep -v -E '^\s*$' "$RUNNER_TEMP/integration.log" | grep -E -A25 'EXCEPTION CAUGHT|Expected:|\[E\]|Error') | head -70)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Test sull'app vera::${motivo}"
      - name: Build
        # Il commit compare nella firma della versione (in basso a sinistra).
        run: flutter build windows --release --dart-define=GF_COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GestionaleFinanziaria-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  # App Android da installare sul telefono (Actions -> esecuzione -> Artifacts):
  # variante "ufficiale" (dati veri) e "prova" (installabile accanto), più il test
  # sull'app vera in un emulatore Android (vedi docs/adr/0010).
  android:
    name: Android (APK e test nell'emulatore)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter e licenze Android
        run: |
          flutter --disable-analytics
          flutter --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      # Chiave definitiva dai secret di GitHub (mai nel repository). Senza secret
      # (es. pull request da fork) si usa la chiave di debug: APK solo per prova.
      - name: Chiave di firma definitiva
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Android::Chiave di firma non configurata: APK firmati con la chiave di debug (solo per prova, i dati non sopravvivono al cambio di chiave)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - name: Build APK (ufficiale e prova, telefoni a 64 bit)
        run: |
          set -o pipefail
          for variante in ufficiale prova; do
            flutter build apk --release --flavor "$variante" \
              --target-platform android-arm64 \
              --dart-define=GF_COMMIT=${{ github.sha }} \
              2>&1 | tee -a "$RUNNER_TEMP/build-android.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GestionaleFinanziaria-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-ufficiale-release.apk
            build/app/outputs/flutter-apk/app-prova-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Accelerazione KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test sull'app vera nell'emulatore Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'set -o pipefail; flutter test integration_test --flavor prova -d emulator-5554 -r expanded 2>&1 | tee "$RUNNER_TEMP/integration-android.log"'
      - name: Motivo dell'errore
        if: failure()
        run: |
          log="$(cat "$RUNNER_TEMP/build-android.log" "$RUNNER_TEMP/integration-android.log" 2>/dev/null)"
          motivo="$( (echo "$log" | grep -E 'SCHERMO:|FINESTRA:|PULSANTE:|Warning: A call to tap'; echo "$log" | grep -v -E '^\s*$' | grep -E -A25 'EXCEPTION CAUGHT|Expected:|\[E\]|Error|FAILURE|What went wrong') | head -70)"
          motivo="${motivo//'%'/'%25'}"
          motivo="${motivo//$'\n'/'%0A'}"
          motivo="${motivo//$'\r'/}"
          echo "::error title=Android::${motivo}"
      - name: Via la chiave di firma dal runner
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
