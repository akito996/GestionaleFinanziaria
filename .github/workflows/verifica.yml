# Verifica del codice a ogni push e pull request: formattazione, analisi statica severa e test.
# La versione di Flutter è quella scritta in pubspec.yaml (environment.flutter).
name: Verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter dal repository ufficiale, senza azioni di terzi: subosito/flutter-action usa
      # actions/cache per etichetta e la regola "azioni fissate per SHA" del repository lo blocca.
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          echo "Flutter $version"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Codice generato aggiornato (drift)
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analisi statica
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # App Windows da scaricare e provare (Actions -> esecuzione -> Artifacts).
  # Non firmata: Windows SmartScreen mostra un avviso al primo avvio.
  windows:
    name: Build Windows (prova)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter (versione da pubspec.yaml)
        run: |
          version="$(sed -n 's/^  flutter: *//p' pubspec.yaml)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prima configurazione di Flutter
        run: |
          flutter --disable-analytics
          flutter --version
      - name: Dipendenze (bloccate da pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Test sull'app vera (primo avvio, blocco, sblocco, recupero)
        run: flutter test integration_test -d windows
      - name: Build
        run: flutter build windows --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GestionaleFinanziaria-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
