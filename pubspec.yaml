name: gestionale_finanziaria
description: "App open source di finanza personale, privacy-first"
publish_to: 'none'

# MAJOR.MINOR.PATCH+BUILD (il build number cresce a ogni release Android)
version: 0.9.0+1

environment:
  sdk: ^3.13.5
  # versione esatta: la stessa sul PC e nella pipeline (il workflow Verifica la legge da qui)
  flutter: 3.47.7

dependencies:
  archive: ^4.4.0
  crypto: ^3.0.7
  drift: ^2.35.2
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis_auth: ^2.3.4
  http: ^1.6.0
  image_picker: ^1.2.4
  meta: ^1.19.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx_engine: 0.6.1
  sodium: ^4.1.1+2
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Carattere incorporato nei report PDF (Apache 2.0, vedi LICENSE-Roboto.txt)
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

hooks:
  user_defines:
    sqlite3:
      # Database locale cifrato con SQLCipher (AES-256 + HMAC-SHA512), decisione del 10/10/2026.
      # Il pacchetto sqlite3 scarica la build precompilata e ne verifica l'impronta SHA-256.
      source: sqlcipher
